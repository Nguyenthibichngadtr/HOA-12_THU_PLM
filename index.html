<main>
<header><div><h1>Giải mật mã Hóa học</h1><p>Phiếu học tập số 2 · Polymer. Trả lời 10 câu để thu thập chữ cái và đoán thông điệp.</p><button id="restart" type="button" hidden>Lượt chơi mới</button></div><div class="hero-art" aria-hidden="true"><div class="lab-art"><span class="lab-tube one"></span><span class="lab-tube two"></span><span class="lab-flask"><span class="lab-liquid"></span></span><span class="lab-spark">✦</span></div></div></header>
<section id="login"><form id="join"><label for="player">Họ và tên học sinh</label> <input id="player" placeholder="Ví dụ: Nguyễn Minh Anh" autofocus required maxlength="80" autocomplete="off"> <button class="primary">Vào chơi</button></form></section>

</main>

const message = 'HÃY HẠN CHẾ SỬ DỤNG ĐỒ NHỰA DÙNG MỘT LẦN';
const get = id => document.getElementById(id);
let deck = [], index, earned, responses;
const code = message.replaceAll(' ', '');
const letters = [...new Set(code)];
const positions = [...Array(code.length).keys()];
let previous = {questions: [], keyword: ''};
try { previous = JSON.parse(localStorage.getItem('phieu2-luot-choi')) || previous; } catch {}
function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
function drawTiles() {
  let slot = 0;
  const words = message.split(' ').map(word => {
    const group = document.createElement('span');
    group.className = 'word';
    group.style.setProperty("--word-length", word.length);
    for (const letter of word) {
      const tile = document.createElement('span');
      const position = slot++;
      const found = earned.has(position);
      const preview = get('quiz').hidden ? undefined : responses.find(response => response.slot === position)?.letter;
      tile.className = found ? 'tile earned' : preview ? 'tile pending' : 'tile';
      tile.textContent = found ? letter : (preview ?? '·');
      if (!get('quiz').hidden && position === deck[index][3]) tile.classList.add('current');
      tile.title = 'Ô ' + (position + 1);
      group.append(tile);
    }
    return group;
  });
  const rows = [words.slice(0, 5), words.slice(5)].map(groups => {
    const row = document.createElement('div');
    row.className = 'code-row';
    row.style.gridTemplateColumns = groups.map(group =>
      "minmax(0, " + group.style.getPropertyValue("--word-length") + "fr)"
    ).join(" ");
    row.append(...groups);
    return row;
  });
  get('tiles').replaceChildren(...rows);
  get('count').textContent = get('quiz').hidden ? 'Chữ cái thu được: ' + earned.size + '/' + deck.length : 'Chữ cái đã chọn: ' + responses.length + '/' + deck.length;
}
function showQuestion() {
  const [prompt, answers, correct, slot] = deck[index];
  drawTiles();
  get('progress').textContent = 'Câu ' + (index + 1) + '/' + deck.length + ' · Ô mật mã số ' + (slot + 1);
  get('question').textContent = prompt;
  get('feedback').textContent = '';
  get('next').hidden = true;
  const reward = code[slot];
  const decoys = shuffle(letters.filter(letter => letter !== reward)).slice(0, 3);
  const labels = answers.map((_, i) => i === correct ? reward : decoys.shift());
  const buttons = shuffle(answers.map((_, i) => i)).map(answer => {
    const button = document.createElement('button');
    button.textContent = labels[answer] + '. ' + answers[answer];
    button.setAttribute('aria-pressed', 'false');
    button.onclick = () => {
      if (!deadline || Date.now() >= deadline) { finish(true); return; }
      responses[index] = {answer, labels, slot, letter: labels[answer]};
      drawTiles();
      for (const choice of buttons) {
        choice.classList.toggle('selected', choice === button);
        choice.setAttribute('aria-pressed', String(choice === button));
      }
      get('feedback').textContent = 'Đã chọn phương án ' + labels[answer] + '.';
      get('next').textContent = index === deck.length - 1 ? 'Gửi điểm' : 'Tiếp theo';
      get('next').hidden = false;
    };
    return button;
  });
  get('choices').replaceChildren(...buttons);
}
const resultsUrl = 'https://script.google.com/macros/s/AKfycbx8f05_bjnJ3GmsDY_LydJ1YtfLAfiRS46pfvfulofrFSrIzoSRaEZZe18q_iyc12Mhhg/exec';
const timeLimit = 6 * 60 * 1000;
let deadline = 0, timerInterval;
function stopTimer() {
  clearInterval(timerInterval);
  deadline = 0;
}
function updateTimer() {
  const seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  const minutes = String(Math.floor(seconds / 60)).padStart(2, '0');
  get('timer').textContent = minutes + ':' + String(seconds % 60).padStart(2, '0');
  get('timer').classList.toggle('urgent', seconds <= 60);
  if (seconds === 0) finish(true);
}
function start() {
  stopTimer();
  let picks, questionIds, slots, keyword;
  do {
    picks = shuffle(bank);
    questionIds = picks.map(question => bank.indexOf(question));
  } while (String(questionIds) === String(previous.questions));
  do {
    slots = shuffle(positions).slice(0, picks.length);
    keyword = slots.map(slot => code[slot]).join('');
  } while (keyword === previous.keyword);
  previous = {questions: questionIds, keyword};
  try { localStorage.setItem('phieu2-luot-choi', JSON.stringify(previous)); } catch {}
  deck = picks.map(([prompt, options, answer, note], i) => [prompt, options, answer, slots[i], note]);
  index = 0;
  earned = new Set();
  responses = [];
  get('login').hidden = true;
  get('board').hidden = false;
  get('restart').hidden = false;
  get('review').hidden = true;
  get('quiz').hidden = false;
  showQuestion();
  deadline = Date.now() + timeLimit;
  updateTimer();
  timerInterval = setInterval(updateTimer, 250);
}

  event.preventDefault();
  if (!get('player').value.trim()) return;
  start();

};
get('restart').onclick = () => {
  stopTimer();
  for (const id of ['board', 'quiz', 'review', 'restart']) get(id).hidden = true;
  get('login').hidden = false;
  get('join').reset();
  get('player').focus();
};
get('next').onclick = () => {
  if (!deadline || Date.now() >= deadline) { finish(true); return; }

    showQuestion();
    get('choices').firstElementChild.focus();
  } else {
    finish(false);
  }
};
function finish(timedOut) {
  if (!deadline) return;
  const elapsedSeconds = Math.min(timeLimit / 1000,
    Math.max(0, Math.ceil((Date.now() - deadline + timeLimit) / 1000)));
  stopTimer();
  for (const [, , , slot] of deck.filter((question, i) => responses[i]?.answer === question[2])) {
    earned.add(slot);
  }
  const result = {
    group: get('player').value.trim(),
    correct: earned.size,
    total: deck.length,
    submittedAt: new Date().toISOString()
  };
  let status = 'Điểm đã được ghi trên thiết bị này.';
  try {
    const key = 'phieu2-ket-qua';
    const results = JSON.parse(localStorage.getItem(key) || '[]');
    results.push(result);
    localStorage.setItem(key, JSON.stringify(results));
  } catch {
    status = 'Thiết bị không lưu được điểm.';
  }
  get('score').textContent = result.group + ' · ' + (Math.round(100 * result.correct / result.total) / 10).toLocaleString('vi-VN') + '/10 điểm';
  const prefix = timedOut ? 'Đã hết 6 phút. ' : '';
  get('save-status').textContent = prefix + 'Đang gửi điểm lên Google Sheets…';
  const payload = {
    hoTen: result.group,
    tongSoCau: deck.length,
    thoiGianGiay: elapsedSeconds,
    soCauDung: result.correct,
    cauSai: deck.flatMap((question, i) => {
      const [ , answers, correct] = question;
      const response = responses[i];
      return response && response.answer !== correct
        ? [{cauGoc: bank.findIndex(item => item[0] === question[0]) + 1, daChon: answers[response.answer]}]
        : [];
    })
  };
  sendResults(payload, prefix, status, deck);
  get('review').hidden = false;
  get('quiz').hidden = true;
  get('score').focus();
  drawTiles();
}

async function sendResults(payload, prefix, localStatus, submittedDeck) {
  let message;
  try {
    const response = await fetch(resultsUrl, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const receipt = await response.json();
    if (!receipt.ok) {
      message = (receipt.message || 'Google Sheets chưa xác nhận kết quả.') + ' ' + localStatus;
    } else {
      message = 'Đã lưu điểm vào Google Sheets.';
      if (receipt.vinhDanhDaCapNhat === false) message += ' Bảng vinh danh chưa cập nhật.';
    }
  } catch {
    message = 'Chưa xác nhận được điểm trên Google Sheets. ' + localStatus;
  }
  if (deck === submittedDeck && !get('review').hidden) {
    get('save-status').textContent = prefix + message;
  }
}
</script></html>
